name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-cairo
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-adwaita-icon-theme
            mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-python-psutil
            mingw-w64-ucrt-x86_64-pyinstaller
            mingw-w64-ucrt-x86_64-pyinstaller-hooks-contrib
            mingw-w64-ucrt-x86_64-hidapi
            mingw-w64-ucrt-x86_64-libusb

      - name: Python packages not in MSYS2
        run: python -m pip install --break-system-packages --no-warn-script-location pyusb

      - name: Check the toolkit imports
        run: |
          python -c "import gi; gi.require_version('Gtk','4.0'); gi.require_version('Adw','1'); from gi.repository import Gtk, Adw; print('GTK', Gtk.get_major_version(), Gtk.get_minor_version(), 'Adw', Adw.get_major_version(), Adw.get_minor_version())"
          python -c "from z890lcd import transport; transport.load_hidapi(); print('hidapi ok')"
          python -c "import z890lcd.gui.app, z890lcd.service, z890lcd.cli; print('modules ok')"

      - name: Version
        id: version
        run: echo "version=$(python -c 'import z890lcd; print(z890lcd.__version__)')" >> "$GITHUB_OUTPUT"

      - name: PyInstaller
        run: pyinstaller --noconfirm packaging/windows/z890-lcd.spec

      - name: Smoke test the bundle
        run: |
          ./dist/z890-lcd/z890-lcd.exe --version
          ls dist/z890-lcd/*.dll | grep -iE "hidapi|libusb|gtk-4|adwaita"

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ steps.version.outputs.version }} packaging\windows\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: z890-lcd-unleashed-windows
          path: dist/*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" (Get-Item dist\*.exe).FullName --clobber
